[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ligojcli", "ligojcli.plugins", "ligojcli.dev_demo"]

[tool.setuptools.package-data]
ligojcli = ["assets/*.png"]

[project]
name = "ligoj-cli"
version = "1.0.2"
description = "Ligoj CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Fabrice Daugan", email = "fdaugan@kloudy.io" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
dependencies = [
    "colorama==0.4.6",
    "requests==2.34.2",
    "dnspython==2.7.0",
    "pyyaml==6.0.3",
    "configparser==7.2.0",
    "unidecode==1.4.0",
    "jsonschema==4.26.0",
    "jsonmerge==1.9.2",
    "Jinja2==3.1.6",
    "pytimeparse==1.1.8"
]

[project.scripts]
ligoj = "ligojcli.ligoj:ligoj"

[project.urls]
Homepage = "https://github.com/ligoj/cli"
Documentation = "https://github.com/ligoj/cli/README.md"
Repository = "https://github.com/ligoj/cli"
Issues = "https://github.com/ligoj/cli/issues"

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "flake8"
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "E741", "E402"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
